# Port on which the web client runs (different from 8080 on server C)
server.port=${PORT:8090}

# Connection to server C (maintains the monitoring session)
iot.server.host=${IOT_SERVER_HOST:127.0.0.1}
iot.server.port=${IOT_SERVER_PORT:8080}
iot.server.username=${IOT_SERVER_USERNAME:admin}
iot.server.password=${IOT_SERVER_PASSWORD:Admin@2024!}

# Direct connection to the Python auth-service to validate browser logins
iot.auth.host=${IOT_AUTH_HOST:127.0.0.1}
iot.auth.port=${IOT_AUTH_PORT:9000}

spring.thymeleaf.cache=false
